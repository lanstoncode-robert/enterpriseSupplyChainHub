name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild committed Tailwind CSS
        run: npm run build:css
      - name: Ensure compiled CSS is committed
        run: git diff --exit-code -- public/assets/app.css
      - name: Unit, integration, and data tests
        run: npm test
      - name: Static accessibility checks
        run: npm run a11y
      - name: Runtime smoke test
        run: npm run smoke

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: supply-chain-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
